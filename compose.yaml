services:
  oncall:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bind inside the container; host publication below remains loopback-only.
      ONCALL_HOST: 0.0.0.0
      ONCALL_PORT: "8200"
      ONCALL_MCP_PORT: "8000"
      ONCALL_TARGET_PORT: "8100"
      ONCALL_MCP_URL: http://127.0.0.1:8000/mcp
      ONCALL_TARGET_URL: http://127.0.0.1:8100
      # Empty picks demo.db/live.db by mode, both on this persistent volume.
      ONCALL_DB_PATH: ${ONCALL_DB_PATH:-}
      ONCALL_API_KEY: ${ONCALL_API_KEY:?Generate a random ONCALL_API_KEY in .env before starting Docker}
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - oncall-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  oncall-data:
